<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft moonstone gradient -->
    <radialGradient id="g" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#c9dceb"/>
    </radialGradient>

    <!-- Engraved effect -->
    <filter id="engrave" x="-20%" y="-20%" width="140%" height="140%">
      <!-- shadow -->
      <feOffset dx="0" dy="1.5" result="offShadow"/>
      <feGaussianBlur in="offShadow" stdDeviation="1.5" result="blurShadow"/>
      
      <!-- highlight -->
      <feOffset in="SourceGraphic" dx="0" dy="-1" result="offHighlight"/>
      <feGaussianBlur in="offHighlight" stdDeviation="1" result="blurHighlight"/>

      <!-- merge -->
      <feMerge>
        <feMergeNode in="blurHighlight"/>
        <feMergeNode in="blurShadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Oval moonstone -->
  <ellipse cx="100" cy="100" rx="60" ry="80"
           fill="url(#g)"/>

  <!-- Lambda engraving -->
  <text x="100" y="118"
        text-anchor="middle"
        font-size="64"
        font-family="serif"
        fill="#26343c"
        filter="url(#engrave)">
    λ
  </text>
</svg>
