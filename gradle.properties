kotlin.code.style=official
org.gradle.jvmargs=-Xmx4096m

# Parallel execution across subprojects
org.gradle.parallel=true

# Build caching — reuses outputs from previous builds
org.gradle.caching=true

# Incremental Kotlin compilation — only recompiles changed files
kotlin.incremental=true

# Daemon stays alive between builds (already default, but make explicit)
org.gradle.daemon=true

# Optional: cap worker threads to avoid overwhelming the system
# org.gradle.workers.max=4

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# Compose settings
org.jetbrains.compose.experimental.uikit.enabled=true
